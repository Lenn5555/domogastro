# Shop-Server für Domo Gastro: Kundenkonto, Bestellung, Bestellstatus, Bewertungen, PayPal.
# Einrichten und Veröffentlichen über GitHub Actions → "Shop-Server" (siehe .github/workflows/server.yml).
# Geheimnisse NIE hier eintragen, sondern als Worker-Secrets: RESEND_API_KEY, PAYPAL_CLIENT_ID, PAYPAL_SECRET, VERWALTUNG_SCHLUESSEL.
name = "domogastro-shop"
main = "src/index.js"
compatibility_date = "2026-09-01"
# Cloudflare-Konto (nicht geheim)
account_id = "4b855f0470ebca3d071a170d0a9b51df"

[vars]
# Seiten, die den Server aufrufen dürfen (kommagetrennt)
HERKUNFT = "https://domogastro.de,https://www.domogastro.de,https://lenn5555.github.io,http://localhost:8000"
# Öffentliche Adresse der Website (für Links in Mails und die Rückkehr von PayPal)
SITE_URL = "https://domogastro.de"
# Öffentliche Adresse dieses Servers (Ein-Klick-Abmeldung im Newsletter, List-Unsubscribe)
API_URL = "https://domogastro-shop.beinundfuss.workers.dev"
# Newsletter-Versand: höchstens so viele Newsletter-Mails pro Tag (UTC). Resend Free: 100 Mails/Tag INSGESAMT, Rest bleibt für Bestellmails.
# Mit Resend Pro (50.000/Monat, kein Tageslimit) z. B. auf 2000 erhöhen.
NEWSLETTER_TAGESLIMIT = "60"
BESTELL_EMAIL = "sales@ts-systec.de"
# Absender muss bei Resend als Domain bestätigt sein (SPF, DKIM, DMARC). Bis dahin werden keine Mails verschickt.
ABSENDER = "Domo Gastro <bestellung@domogastro.de>"
RUECKSENDE_ADRESSE = "T&S Systemtechnik GmbH, Am Hintergraben 26, 64319 Pfungstadt"
BANK_INHABER = "T&S Systemtechnik GmbH"
BANK_IBAN = "DE17 5084 0005 0610 6090 00"
# "ja" = PayPal-Testumgebung, "nein" = echtes PayPal (Lenn 2026-11-19: direkt live)
PAYPAL_SANDBOX = "nein"

# Täglich 8 Uhr UTC: fällige Bitten um Bewertung verschicken. Alle 10 Minuten: laufenden Newsletter gedrosselt weiterverschicken.
[triggers]
crons = ["0 8 * * *", "*/10 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "domogastro"
# Datenbank in der EU (Jurisdiction EU), angelegt 18.11.2026
database_id = "52ad0eaf-a8d9-40ed-8900-62d7d8359bc4"

[[ratelimits]]
name = "BREMSE"
namespace_id = "2001"
simple = { limit = 30, period = 60 }

# KI-Berater: höchstens 10 Fragen pro Minute und Besucher (jede Antwort kostet)
[[ratelimits]]
name = "BERATER_BREMSE"
namespace_id = "2002"
simple = { limit = 10, period = 60 }

# Newsletter-Anmeldung: höchstens 5 pro Minute und Besucher (jede Anmeldung verschickt eine Bestätigungsmail)
[[ratelimits]]
name = "NEWSLETTER_BREMSE"
namespace_id = "2003"
simple = { limit = 5, period = 60 }
