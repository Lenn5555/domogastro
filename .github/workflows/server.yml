# Shop-Server (Cloudflare Worker + D1).
# Bei jedem Push: nur Tests, nichts wird eingerichtet.
# Von Hand (Actions → "Shop-Server" → Run workflow), Feld "aktion":
#   pruefen            nur Tests
#   datenbank-anlegen  legt die D1-Datenbank "domogastro" an (falls noch nicht da) und zeigt ihre ID im Protokoll
#   veroeffentlichen   Tests, Datenbank-Tabellen anlegen, Server veröffentlichen, Secrets übertragen
# Braucht die GitHub-Secrets CLOUDFLARE_API_TOKEN und VERWALTUNG_SCHLUESSEL,
# optional RESEND_API_KEY, PAYPAL_CLIENT_ID, PAYPAL_SECRET. Account-ID steht in worker/wrangler.toml.
name: Shop-Server
on:
  push:
    paths: ["worker/**", "daten/**", "werkzeuge/build_site.py"]
  workflow_dispatch:
    inputs:
      aktion:
        description: "pruefen / datenbank-anlegen / veroeffentlichen"
        default: "pruefen"
permissions: { contents: read }
jobs:
  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: worker } }
    env:
      AKTION: ${{ inputs.aktion || 'pruefen' }}
    steps:
      - uses: actions/checkout@v4
      # Schlüssel bereinigen: beim Einfügen rutschen leicht Zeilenumbrüche oder Leerzeichen mit hinein
      - name: Cloudflare-Schlüssel vorbereiten
        if: env.AKTION != 'pruefen'
        env:
          ROH: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          T=$(printf '%s' "$ROH" | grep -oE '[A-Za-z0-9_-]{40,}' | head -n1 || true)
          if [ -z "$T" ]; then echo "::error::CLOUDFLARE_API_TOKEN fehlt oder sieht nicht wie ein Cloudflare-Schlüssel aus."; exit 1; fi
          echo "::add-mask::$T"
          echo "CLOUDFLARE_API_TOKEN=$T" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: python3 werkzeuge/build_site.py
        working-directory: .
      - run: npm ci
      - run: npm test
        if: env.AKTION != 'datenbank-anlegen'

      - name: Datenbank anlegen
        if: env.AKTION == 'datenbank-anlegen'
        run: |
          if npx wrangler d1 list --json | grep -q '"name": *"domogastro"'; then
            echo "Datenbank gibt es schon:"
          else
            npx wrangler d1 create domogastro
          fi
          npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0));const d=l.find(x=>x.name==="domogastro");console.log("DATENBANK-ID: "+d.uuid)'

      - name: Server veröffentlichen
        if: env.AKTION == 'veroeffentlichen'
        env:
          VERWALTUNG_SCHLUESSEL: ${{ secrets.VERWALTUNG_SCHLUESSEL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_SECRET: ${{ secrets.PAYPAL_SECRET }}
        run: |
          npx wrangler d1 execute domogastro --remote --file=schema.sql
          npx wrangler deploy
          for s in VERWALTUNG_SCHLUESSEL RESEND_API_KEY PAYPAL_CLIENT_ID PAYPAL_SECRET; do
            if [ -n "${!s}" ]; then printf '%s' "${!s}" | npx wrangler secret put "$s"; else echo "$s nicht gesetzt, übersprungen"; fi
          done
